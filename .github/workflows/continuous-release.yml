name: Continuous build

on:
  push:
    branches:
      - 'master'
    paths-ignore:
      - '**/*.md'

permissions:
  contents: write

jobs:
  debug-apk:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Restore release keystore
        env:
          FLAUNCHER_KEYSTORE_PASSWORD: ${{ secrets.FLAUNCHER_KEYSTORE_PASSWORD }}
          FLAUNCHER_SIGNING_KEY_ALIAS: ${{ secrets.FLAUNCHER_SIGNING_KEY_ALIAS }}
          FLAUNCHER_SIGNING_KEY_PASSWORD: ${{ secrets.FLAUNCHER_SIGNING_KEY_PASSWORD }}
          KEYSTORE_FILE_BASE64: ${{ secrets.KEYSTORE_FILE_BASE64 }}
        run: |
          echo -n "$KEYSTORE_FILE_BASE64" | base64 -d > android/app/upload-keystore.jks
          echo "FLAUNCHER_KEYSTORE_PASSWORD=$FLAUNCHER_KEYSTORE_PASSWORD" >> $GITHUB_ENV
          echo "FLAUNCHER_SIGNING_KEY_ALIAS=$FLAUNCHER_SIGNING_KEY_ALIAS" >> $GITHUB_ENV
          echo "FLAUNCHER_SIGNING_KEY_PASSWORD=$FLAUNCHER_SIGNING_KEY_PASSWORD" >> $GITHUB_ENV
      - name: Build debug APK
        run: |
          flutter --no-color build apk --debug \
            --build-number $GITHUB_RUN_NUMBER \
            --build-name=dev.r$GITHUB_RUN_NUMBER
          cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/MTlauncher-debug.apk
      - name: Upload debug APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: MTlauncher-debug
          path: build/app/outputs/flutter-apk/MTlauncher-debug.apk
          retention-days: 7
      - name: Publish debug APK to fixed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 固定 tag "debug":每次 debug 云编译都覆盖这里,应用端用固定 URL 下载最新 debug 包。
          # notes 里写入 versionName/versionCode,供 debug 变体「检查更新」解析对比。
          retry_cmd() {
            for i in 1 2 3 4 5 6; do
              if "$@"; then return 0; fi
              echo "Command failed (attempt $i), retrying in 10s..."
              sleep 10
            done
            return 1
          }
          APK=build/app/outputs/flutter-apk/MTlauncher-debug.apk
          NOTES=$(printf '最新 master 分支 debug 构建,每次推送自动覆盖。\n固定下载地址: https://github.com/%s/releases/download/debug/MTlauncher-debug.apk\nversionName=dev.r%s\nversionCode=%s' \
            "$GITHUB_REPOSITORY" "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_NUMBER")
          if retry_cmd gh release view debug --repo $GITHUB_REPOSITORY --json tagName > /dev/null 2>&1; then
            retry_cmd gh release edit debug --repo $GITHUB_REPOSITORY --notes "$NOTES"
            retry_cmd gh release upload debug --repo $GITHUB_REPOSITORY "$APK" --clobber
          else
            retry_cmd gh release create debug --repo $GITHUB_REPOSITORY \
              --target "$GITHUB_SHA" \
              --title "Debug Build" \
              --notes "$NOTES" \
              --prerelease \
              "$APK"
          fi

  release-apk:
    name: Release APK
    env:
      OUTPUT_DIR: 'build/app/outputs/flutter-apk'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Verify environment
        run: |
          java --version
          flutter doctor -v
      - name: Set version variables
        id: set_version_variables
        run: |
          cat version_numbers >> $GITHUB_OUTPUT
          export $(cat version_numbers | xargs)
          echo "FULL_VERSION_NUMBER=$(date '+%Y.%m').$(printf '%03d' $MONTH_VERSION_NUMBER)" >> $GITHUB_OUTPUT
      - name: Build
        env:
          FLAUNCHER_KEYSTORE_PASSWORD: ${{ secrets.FLAUNCHER_KEYSTORE_PASSWORD }}
          FLAUNCHER_SIGNING_KEY_ALIAS: ${{ secrets.FLAUNCHER_SIGNING_KEY_ALIAS }}
          FLAUNCHER_SIGNING_KEY_PASSWORD: ${{ secrets.FLAUNCHER_SIGNING_KEY_PASSWORD }}
          KEYSTORE_FILE_BASE64: ${{ secrets.KEYSTORE_FILE_BASE64 }}
          BUILD_NUMBER: ${{ steps.set_version_variables.outputs.BUILD_NUMBER }}
          FULL_VERSION_NUMBER: ${{ steps.set_version_variables.outputs.FULL_VERSION_NUMBER }}
        run: |
          sudo apt install rename -y
          echo -n "$KEYSTORE_FILE_BASE64" | base64 -d > android/app/upload-keystore.jks
          flutter --no-color build apk --release --build-number $BUILD_NUMBER --build-name=$FULL_VERSION_NUMBER
          file-rename 's/app-(.*)-release.apk/MTlauncher-$1-release.apk/' $OUTPUT_DIR/*.apk
          mv $OUTPUT_DIR/app-release.apk $OUTPUT_DIR/MTlauncher-universal-release.apk
      - name: Upload APKs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: MTlauncher-release
          path: ${{ env.OUTPUT_DIR }}/MTlauncher-*.apk
          retention-days: 30
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          MONTH_VERSION_NUMBER: ${{ steps.set_version_variables.outputs.MONTH_VERSION_NUMBER }}
          FULL_VERSION_NUMBER: ${{ steps.set_version_variables.outputs.FULL_VERSION_NUMBER }}
        run: |
          # 同 tag 的 release 已存在时改为覆盖上传,保证重复推送不失败
          export TAG_NAME=v$FULL_VERSION_NUMBER
          TITLE="Release #$MONTH_VERSION_NUMBER $(date '+%B %Y') ($FULL_VERSION_NUMBER)"
          if gh release view $TAG_NAME --repo $GITHUB_REPOSITORY > /dev/null 2>&1; then
            gh release edit $TAG_NAME --repo $GITHUB_REPOSITORY --latest --title "$TITLE"
            gh release upload $TAG_NAME --repo $GITHUB_REPOSITORY $OUTPUT_DIR/MTlauncher-*.apk --clobber
          else
            gh release create $TAG_NAME --repo $GITHUB_REPOSITORY --latest --title "$TITLE" --notes "" $OUTPUT_DIR/MTlauncher-*.apk
          fi
